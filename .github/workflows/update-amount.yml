name: Aktualizovat vybranou castku

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Stahnout repozitar
        uses: actions/checkout@v4

      - name: Spocitat prijate dary
        shell: python
        run: |
          import json
          import urllib.request
          import urllib.error
          from datetime import datetime, timezone

          URL = "https://www.csob.cz/spa/finance/lta/detail/transactions"
          ACCOUNT = 377658515
          START_DATE = "2026-09-30"
          GOAL = 500000

          today = datetime.now(timezone.utc).date().isoformat()

          page = 1
          raised = 0.0

          while True:
              payload = {
                  "accountList": [
                      {
                          "accountNumberM24": ACCOUNT
                      }
                  ],
                  "filterList": [
                      {
                          "name": "AccountingDate",
                          "operator": "ge",
                          "valueList": [START_DATE]
                      },
                      {
                          "name": "AccountingDate",
                          "operator": "le",
                          "valueList": [today]
                      }
                  ],
                  "paging": {
                      "rowsPerPage": 10,
                      "pageNumber": page
                  },
                  "sortList": [
                      {
                          "name": "AccountingDate",
                          "direction": "DESC",
                          "order": 1
                      }
                  ]
              }

              data = json.dumps(payload).encode("utf-8")

              request = urllib.request.Request(
                  URL,
                  data=data,
                  headers={
                      "Content-Type": "application/json",
                      "Accept": "application/json",
                      "User-Agent": "Mozilla/5.0",
                      "Origin": "https://www.csob.cz",
                      "Referer": "https://www.csob.cz/firmy/bezne-ucty/transparentni-ucty/ucet?account=377658515"
                  },
                  method="POST"
              )

              opener = urllib.request.build_opener(
                  urllib.request.HTTPRedirectHandler()
              )

              try:
                  response = opener.open(request, timeout=30)
              except urllib.error.HTTPError as error:
                  if error.code == 307:
                      redirect_url = error.headers.get("Location")
                      if not redirect_url:
                          raise

                      request = urllib.request.Request(
                          redirect_url,
                          data=data,
                          headers={
                              "Content-Type": "application/json",
                              "Accept": "application/json",
                              "User-Agent": "Mozilla/5.0",
                              "Origin": "https://www.csob.cz",
                              "Referer": "https://www.csob.cz/firmy/bezne-ucty/transparentni-ucty/ucet?account=377658515"
                          },
                          method="POST"
                      )

                      response = urllib.request.urlopen(
                          request,
                          timeout=30
                      )
                  else:
                      raise

              result = json.loads(
                  response.read().decode("utf-8")
              )

              transactions = result.get(
                  "accountedTransaction", []
              )

              for transaction in transactions:
                  base = transaction.get("baseInfo", {})
                  amount_data = base.get(
                      "accountAmountData", {}
                  )

                  amount = float(
                      amount_data.get("amount", 0)
                  )

                  currency = amount_data.get(
                      "currencyCode"
                  )

                  if amount > 0 and currency == "CZK":
                      raised += amount

              paging = result.get("paging", {})
              page_count = int(
                  paging.get("pageCount", 1)
              )

              if page >= page_count:
                  break

              page += 1

          result = {
              "raised": round(raised, 2),
              "goal": GOAL
          }

          with open(
              "amount.json",
              "w",
              encoding="utf-8"
          ) as file:
              json.dump(
                  result,
                  file,
                  ensure_ascii=False,
                  indent=2
              )
              file.write("\n")

          print(result)

      - name: Ulozit novou castku
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add amount.json

          if git diff --cached --quiet; then
            echo "Castka se nezmenila."
          else
            git commit -m "Aktualizace vybrane castky"
            git push
          fi
