name: Aktualizovat vybranou castku

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Stahnout repozitar
        uses: actions/checkout@v4

      - name: Nainstalovat requests
        run: python -m pip install requests

      - name: Spocitat prijate dary
        shell: python
        run: |
          import json
          import requests
          from datetime import datetime, timezone

          URL = "https://www.csob.cz/spa/finance/lta/detail/transactions"
          ACCOUNT = 377658515
          START_DATE = "2026-09-30"
          GOAL = 500000

          today = datetime.now(timezone.utc).date().isoformat()

          headers = {
              "Accept": "application/json",
              "Content-Type": "application/json",
              "User-Agent": "Mozilla/5.0",
              "Origin": "https://www.csob.cz",
              "Referer": "https://www.csob.cz/firmy/bezne-ucty/transparentni-ucty/ucet?account=377658515"
          }

          session = requests.Session()
          raised = 0.0
          page = 1

          while True:
              payload = {
                  "accountList": [
                      {
                          "accountNumberM24": ACCOUNT
                      }
                  ],
                  "filterList": [
                      {
                          "name": "AccountingDate",
                          "operator": "ge",
                          "valueList": [START_DATE]
                      },
                      {
                          "name": "AccountingDate",
                          "operator": "le",
                          "valueList": [today]
                      }
                  ],
                  "paging": {
                      "rowsPerPage": 100,
                      "pageNumber": page
                  },
                  "sortList": [
                      {
                          "name": "AccountingDate",
                          "direction": "DESC",
                          "order": 1
                      }
                  ]
              }

              response = session.post(
                  URL,
                  json=payload,
                  headers=headers,
                  timeout=30,
                  allow_redirects=True
              )

              print("HTTP:", response.status_code)
              print("URL:", response.url)

              response.raise_for_status()
              result = response.json()

              transactions = result.get("accountedTransaction", [])

              for transaction in transactions:
                  amount_data = (
                      transaction
                      .get("baseInfo", {})
                      .get("accountAmountData", {})
                  )

                  amount = float(amount_data.get("amount", 0) or 0)
                  currency = amount_data.get("currencyCode")

                  if amount > 0 and currency == "CZK":
                      raised += amount

              paging = result.get("paging", {})
              page_count = int(paging.get("pageCount", 1) or 1)

              if page >= page_count:
                  break

              page += 1

          output = {
              "raised": round(raised, 2),
              "goal": GOAL
          }

          with open("amount.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)
              f.write("\n")

          print("Vysledek:", output)

      - name: Ulozit novou castku
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add amount.json

          if git diff --cached --quiet; then
            echo "Castka se nezmenila."
          else
            git commit -m "Aktualizace vybrane castky"
            git push
          fi
