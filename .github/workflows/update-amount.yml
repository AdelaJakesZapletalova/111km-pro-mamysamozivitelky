name: Aktualizovat vybranou castku

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Stahnout repozitar
        uses: actions/checkout@v4

      - name: Spocitat prijate dary
        shell: python
        run: |
          import json
          import urllib.request
          from datetime import datetime, timezone

          URL = "https://www.csob.cz/spa/finance/lta/detail/transactions"
          ACCOUNT = 377658515
          START_DATE = "2026-09-30"
          GOAL = 500000

          today = datetime.now(timezone.utc).date().isoformat()

          payload = {
              "accountNumber": ACCOUNT,
              "dateFrom": START_DATE,
              "dateTo": today,
              "page": 1
          }

          data = json.dumps(payload).encode("utf-8")

          request = urllib.request.Request(
              URL,
              data=data,
              headers={
                  "Content-Type": "application/json",
                  "Accept": "application/json",
                  "User-Agent": "Mozilla/5.0"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.loads(response.read().decode("utf-8"))
          except Exception as e:
              print("Chyba pri nacitani CSOB:", repr(e))
              raise

          transactions = result.get("accountedTransaction", [])

          raised = 0

          for transaction in transactions:
              base = transaction.get("baseInfo", {})
              amount_data = base.get("accountAmountData", {})
              amount = float(amount_data.get("amount", 0) or 0)

              transaction_date = base.get("accountingDate", "")

              if transaction_date[:10] >= START_DATE and amount > 0:
                  raised += amount

          output = {
              "raised": round(raised, 2),
              "goal": GOAL
          }

          with open("amount.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)
              f.write("\n")

          print("Vysledek:", output)

      - name: Ulozit novou castku
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add amount.json

          if git diff --cached --quiet; then
            echo "Castka se nezmenila."
          else
            git commit -m "Aktualizace vybrane castky"
            git push
          fi
