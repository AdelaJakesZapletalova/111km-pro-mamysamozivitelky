<!doctype html>
<html lang="cs">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Adéla běží 111 km za mámy samoživitelky</title>

  <meta
    name="description"
    content="Adéla běží 111 km Brdami na podporu maminek samoživitelek a jejich dětí."
  >

  <link
    rel="preload"
    as="image"
    href="page-1 (1).png"
    fetchpriority="high"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #fff;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      width: 100%;
      overflow: hidden;
    }

    .page {
      position: relative;
      width: 100%;
      margin: 0;
      padding: 0;
    }

    .canva {
      display: block;
      width: 100%;
      height: auto;
      margin: 0;
      padding: 0;
    }

    .page-two {
      position: relative;
      width: 100%;
    }

    .page-three,
    .page-four {
      content-visibility: auto;
      contain-intrinsic-size: auto 2000px;
    }

    .page-three {
      position: relative;
      width: 100%;
    }


    /* POČÍTADLO */

    .counter {
      position: absolute;
      top: calc(15% + 2cm);
      left: calc(50% + 1cm);
      width: 31%;

      transform: translate(-50%, -50%) scale(1.15);
      transform-origin: center center;

      text-align: center;
      z-index: 10;
    }


    /* NADPIS POČÍTADLA - ČERNÝ */

    .counter h2 {
      margin: 0 0 12px 0;
      padding: 0;

      color: #000 !important;

      font-size: clamp(18px, 2.2vw, 32px);
      font-weight: 700;
      line-height: 1.1;

      white-space: nowrap;
    }


    /* ČÁSTKA */

    .counter .amount {
      margin: 0;
      padding: 0;

      color: #C68BFF !important;

      font-size: clamp(45px, 6vw, 82px);
      font-weight: 800;
      line-height: 1;
    }


    /* PROCENTA */

    .counter .percentage {
      margin: 14px 0 0 0;
      padding: 0;

      color: #C68BFF !important;

      font-size: clamp(13px, 1.3vw, 19px);
      font-weight: 700;
      line-height: 1.2;

      text-align: center;
      white-space: nowrap;
    }


    /* PROGRESS BAR */

    .counter .progress {
      position: relative;
      display: block;

      width: 100%;
      height: 20px;

      margin: 14px auto 0;

      border: 2px solid #C68BFF !important;
      background: transparent;

      overflow: hidden;
    }

    .counter .progress-fill {
      display: block;

      height: 100%;
      width: 0%;

      background-color: #C68BFF !important;

      transition: width 0.6s ease;
    }


    /* INFORMACE O AKTUALIZACI */

    .counter .update-info {
      margin-top: 8px;

      color: #C68BFF !important;

      font-size: clamp(10px, 1vw, 15px);
      font-weight: 600;
      line-height: 1.2;

      text-align: center;
      white-space: nowrap;
    }


    /* TLAČÍTKO CHCI PŘISPĚT */

    .donate-button {
      position: fixed;
      right: 24px;
      bottom: 24px;

      z-index: 1000;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 16px 26px;

      background: #C68BFF;
      color: #fff;

      border: none;
      border-radius: 999px;

      font-family: Arial, Helvetica, sans-serif;
      font-size: 17px;
      font-weight: 800;

      text-decoration: none;
      cursor: pointer;

      box-shadow: 0 5px 18px rgba(0, 0, 0, 0.18);

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .donate-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.23);
    }


    /* TLAČÍTKO WEB NADAČNÍHO FONDU */

    .mamy-button {
      position: fixed;
      left: 24px;
      bottom: 24px;

      z-index: 1000;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 16px 26px;

      background: #C1848C;
      color: #fff;

      border: none;
      border-radius: 999px;

      font-family: Arial, Helvetica, sans-serif;
      font-size: 17px;
      font-weight: 800;

      text-decoration: none;
      cursor: pointer;

      box-shadow: 0 5px 18px rgba(0, 0, 0, 0.18);

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .mamy-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.23);
    }


    /* MAPA */

    .route-map {
      width: 100%;
      height: 70vh;
      min-height: 500px;

      margin: 0;
      padding: 0;

      background: #fff;

      content-visibility: auto;
      contain-intrinsic-size: 500px;
    }

    .route-map iframe {
      display: block;
      width: 100%;
      height: 100%;

      margin: 0;
      padding: 0;

      border: 0;
    }


    /* MOBIL */

    @media (max-width: 700px) {

      .counter {
        top: 15%;
        left: 50%;
        width: 31%;

        transform: translate(-50%, -50%) scale(1.15);
        transform-origin: center center;
      }

      .counter h2 {
        margin-bottom: 6px;
        font-size: clamp(10px, 2.1vw, 18px);
      }

      .counter .amount {
        font-size: clamp(27px, 6vw, 50px);
      }

      .counter .percentage {
        margin-top: 7px;
        font-size: clamp(7px, 1.7vw, 13px);
      }

      .counter .progress {
        height: 12px;
        margin-top: 7px;
        border-width: 2px !important;
      }

      .counter .update-info {
        margin-top: 5px;
        font-size: clamp(6px, 1.5vw, 10px);
      }

      .donate-button {
        right: 14px;
        bottom: 14px;

        padding: 13px 20px;
        font-size: 14px;
      }

      .mamy-button {
        left: 14px;
        bottom: 14px;

        padding: 13px 20px;
        font-size: 14px;
      }

      .route-map {
        height: 60vh;
        min-height: 420px;
      }

    }


    @media (min-width: 1500px) {

      main {
        max-width: 1800px;
        margin: auto;
      }

    }

  </style>
</head>


<body>


  <!-- WEB NADAČNÍHO FONDU -->

  <a
    class="mamy-button"
    href="https://www.mamyvkasi.cz/"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="Navštívit web Nadačního fondu Mámy v kaši"
  >
    WEB NADAČNÍHO FONDU
  </a>


  <!-- CHCI PŘISPĚT -->

  <a
    class="donate-button"
    href="#prispet"
    id="donate-button"
    aria-label="Přejít k QR kódu a možnostem příspěvku"
  >
    CHCI PŘISPĚT
  </a>


  <main>


    <!-- STRÁNKA 1 -->

    <div class="page">

      <img
        class="canva"
        src="page-1 (1).png"
        alt="Adéla běží 111 km za mámy samoživitelky"
        loading="eager"
        fetchpriority="high"
        decoding="async"
      >

    </div>


    <!-- STRÁNKA 2 + POČÍTADLO -->

    <div class="page page-two">

      <img
        class="canva"
        src="page-2 (1).png"
        alt="O projektu"
        loading="lazy"
        fetchpriority="low"
        decoding="async"
      >


      <section
        class="counter"
        aria-label="Stav sbírky"
      >

        <h2>
          Společně jsme zatím vybrali
        </h2>


        <div
          class="amount"
          id="amount"
        >
          0 Kč
        </div>


        <div
          class="percentage"
          id="percentage"
        >
          0 % z cílových 500 000 Kč
        </div>


        <div
          class="progress"
          aria-label="Průběh sbírky"
        >

          <div
            class="progress-fill"
            id="progress-fill"
          ></div>

        </div>


        <div class="update-info">
          Částka se aktualizuje každých 5 minut.
        </div>

      </section>

    </div>


    <!-- STRÁNKA 3 -->

    <div
      class="page page-three"
      id="prispet"
    >

      <img
        class="canva"
        id="page-three-image"
        src="page-3 (1).png"
        alt="Proč pomáhat maminkám samoživitelkám"
        loading="lazy"
        fetchpriority="low"
        decoding="async"
      >

    </div>


    <!-- STRÁNKA 4 -->

    <div class="page page-four">

      <img
        class="canva"
        src="page-4 (1).png"
        alt="Nadační fond Mámy v kaši"
        loading="lazy"
        fetchpriority="low"
        decoding="async"
      >

    </div>


    <!-- MAPA -->

    <section
      class="route-map"
      id="route-map"
      aria-label="Mapa trasy 111 km"
    ></section>


  </main>


  <script>

    /* CHCI PŘISPĚT */

    const donateButton =
      document.getElementById("donate-button");

    const pageThreeImage =
      document.getElementById("page-three-image");


    function scrollToQr() {

      const imageRect =
        pageThreeImage.getBoundingClientRect();

      const imageTop =
        window.scrollY + imageRect.top;

      const qrPosition =
        imageTop + (imageRect.height * 0.81);

      const targetScroll =
        qrPosition - (window.innerHeight * 0.30);

      window.scrollTo({
        top: targetScroll,
        behavior: "smooth"
      });

      history.replaceState(
        null,
        "",
        "#prispet"
      );

    }


    donateButton.addEventListener(
      "click",
      function(event) {

        event.preventDefault();

        if (
          pageThreeImage.complete &&
          pageThreeImage.naturalHeight > 0
        ) {

          scrollToQr();

        } else {

          pageThreeImage.addEventListener(
            "load",
            scrollToQr,
            {
              once: true
            }
          );

          pageThreeImage.scrollIntoView({
            behavior: "auto",
            block: "center"
          });

        }

      }
    );


    /* MAPA */

    const routeMap =
      document.getElementById("route-map");

    let mapLoaded = false;


    function loadMap() {

      if (mapLoaded) {
        return;
      }

      mapLoaded = true;

      const iframe =
        document.createElement("iframe");

      iframe.src =
        "https://mapy.com/s/fomobopetu";

      iframe.title =
        "Trasa 111 km Brdami";

      iframe.loading =
        "lazy";

      iframe.allowFullscreen =
        true;

      routeMap.appendChild(iframe);

    }


    if ("IntersectionObserver" in window) {

      const mapObserver =
        new IntersectionObserver(

          function(entries, observer) {

            entries.forEach(
              function(entry) {

                if (entry.isIntersecting) {

                  loadMap();
                  observer.disconnect();

                }

              }
            );

          },

          {
            rootMargin: "800px 0px"
          }

        );

      mapObserver.observe(routeMap);

    } else {

      loadMap();

    }


    /* POČÍTADLO */

    async function updateAmount() {

      try {

        const response = await fetch(
          "./amount.json?time=" + Date.now(),
          {
            cache: "no-store"
          }
        );

        if (!response.ok) {

          throw new Error(
            "Nepodařilo se načíst amount.json"
          );

        }

        const data =
          await response.json();

        const raised =
          Number(data.raised) || 0;

        const goal =
          Number(data.goal) || 500000;


        /* ČÁSTKA */

        document
          .getElementById("amount")
          .textContent =
            raised.toLocaleString(
              "cs-CZ",
              {
                maximumFractionDigits: 0
              }
            ) + " Kč";


        /* PROCENTA */

        const percentage =
          goal > 0
            ? (raised / goal) * 100
            : 0;

        let percentageText;

        if (
          percentage > 0 &&
          percentage < 0.01
        ) {

          percentageText = "< 0,01";

        } else {

          percentageText =
            percentage.toLocaleString(
              "cs-CZ",
              {
                minimumFractionDigits:
                  percentage < 1 ? 2 : 0,

                maximumFractionDigits: 2
              }
            );

        }

        document
          .getElementById("percentage")
          .textContent =
            percentageText
            + " % z cílových "
            + goal.toLocaleString("cs-CZ")
            + " Kč";


        /* PROGRESS BAR */

        const realBarPercentage =
          Math.min(
            Math.max(percentage, 0),
            100
          );

        const visibleBarPercentage =
          realBarPercentage > 0
            ? Math.max(
                realBarPercentage,
                1.5
              )
            : 0;

        document
          .getElementById("progress-fill")
          .style.width =
            visibleBarPercentage + "%";


      } catch (error) {

        console.error(
          "Chyba při načítání částky:",
          error
        );

        document
          .getElementById("amount")
          .textContent =
            "— Kč";

        document
          .getElementById("percentage")
          .textContent =
            "Cíl 500 000 Kč";

      }

    }


    updateAmount();

    setInterval(
      updateAmount,
      60000
    );

  </script>

</body>

</html>
