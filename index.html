<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Adéla běží 111 km za mámy samoživitelky</title>

  <meta
    name="description"
    content="Adéla běží 111 km Brdami na podporu maminek samoživitelek a jejich dětí."
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: #fff;
      color: #111;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      width: 100%;
      overflow: hidden;
    }

    .canva {
      display: block;
      width: 100%;
      height: auto;
      margin: 0;
      padding: 0;
    }

    /* Druhá stránka s počítadlem */
    .page-two {
      position: relative;
      width: 100%;
    }

    .counter {
      position: absolute;

      /* TUTO POLOHU UŽ NEMĚNÍME */
      top: 6%;
      left: 50%;
      transform: translate(-50%, -50%);

      width: 70%;
      text-align: center;
      z-index: 10;
      color: #111;
    }

    .counter h2 {
      margin: 0 0 8px;
      font-size: clamp(18px, 2.5vw, 34px);
      font-weight: 700;
    }

    .amount {
      margin: 0;
      font-size: clamp(42px, 7vw, 88px);
      font-weight: 800;
      line-height: 1;
    }

    /* Procenta pod částkou */
    .progress-text {
      margin-top: 14px;
      font-size: clamp(14px, 1.5vw, 21px);
      font-weight: 600;
      line-height: 1.3;
    }

    @media (max-width: 700px) {
      .counter {
        width: 85%;
      }

      .counter h2 {
        margin-bottom: 5px;
      }

      .progress-text {
        margin-top: 8px;
      }
    }

    @media (min-width: 1500px) {
      main {
        max-width: 1800px;
        margin: auto;
      }
    }
  </style>
</head>

<body>

  <main>

    <!-- 1. stránka -->
    <img
      class="canva"
      src="page-1.png"
      alt="Adéla běží 111 km za mámy samoživitelky"
    >

    <!-- 2. stránka + počítadlo -->
    <div class="page-two">

      <img
        class="canva"
        src="page-2.png"
        alt="O projektu"
      >

      <section class="counter" aria-label="Vybraná částka">

        <h2>Společně jsme zatím vybrali</h2>

        <div
          class="amount"
          id="amount"
        >
          0 Kč
        </div>

        <div
          class="progress-text"
          id="progress-text"
        >
          0 % z cílových 500 000 Kč
        </div>

      </section>

    </div>

    <!-- 3. stránka -->
    <img
      class="canva"
      src="page-3.png"
      alt="Proč pomáhat maminkám samoživitelkám"
    >

    <!-- 4. stránka -->
    <img
      class="canva"
      src="page-4.png"
      alt="Nadační fond Mámy v kaši"
    >

  </main>


  <script>
    async function updateAmount() {
      try {

        const response = await fetch(
          "amount.json?t=" + Date.now(),
          { cache: "no-store" }
        );

        if (!response.ok) {
          throw new Error("Nepodařilo se načíst amount.json");
        }

        const data = await response.json();

        const raised = Number(data.raised) || 0;
        const goal = Number(data.goal) || 500000;

        /* Zobrazení vybrané částky */
        document.getElementById("amount").textContent =
          new Intl.NumberFormat("cs-CZ", {
            maximumFractionDigits: 0
          }).format(raised) + " Kč";


        /* Výpočet procent */
        const percentage =
          goal > 0
            ? (raised / goal) * 100
            : 0;


        /*
          Malé hodnoty ukážeme přesněji.
          Např.:
          50 Kč z 500 000 Kč = 0,01 %
          250 000 Kč = 50 %
          500 000 Kč = 100 %
          550 000 Kč = 110 %
        */
        let percentageText;

        if (percentage < 1) {
          percentageText =
            percentage.toLocaleString("cs-CZ", {
              minimumFractionDigits: 2,
              maximumFractionDigits: 2
            });
        } else {
          percentageText =
            percentage.toLocaleString("cs-CZ", {
              maximumFractionDigits: 1
            });
        }


        /* Zobrazení procent a cíle */
        document.getElementById("progress-text").textContent =
          percentageText +
          " % z cílových " +
          new Intl.NumberFormat("cs-CZ", {
            maximumFractionDigits: 0
          }).format(goal) +
          " Kč";

      } catch (error) {

        console.error(error);

        document.getElementById("amount").textContent = "— Kč";

        document.getElementById("progress-text").textContent =
          "Cíl 500 000 Kč";
      }
    }


    updateAmount();

    /* Kontrola nové částky každou minutu */
    setInterval(updateAmount, 60000);
  </script>

</body>
</html>
