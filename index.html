<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Adéla běží 111 km za mámy samoživitelky</title>

  <meta
    name="description"
    content="Adéla běží 111 km Brdami na podporu maminek samoživitelek a jejich dětí."
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: #fff;
      color: #111;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      width: 100%;
      max-width: 1366px;
      margin: 0 auto;
      overflow: hidden;
      background: #fff;
    }

    .canva {
      display: block;
      width: 100%;
      height: auto;
      margin: 0;
      padding: 0;
    }

    /* Druhá stránka s počítadlem */
    .page-two {
      position: relative;
      width: 100%;
    }

    .counter {
      position: absolute;

      /* pozice v bílém prostoru */
      top: 15%;
      left: 50%;
      transform: translate(-50%, -50%);

      width: 70%;
      text-align: center;
      z-index: 10;
      color: #111;
    }

    .counter h2 {
      margin: 0 0 8px;
      font-size: clamp(18px, 2.5vw, 34px);
      font-weight: 700;
    }

    .amount {
      margin: 0;
      font-size: clamp(42px, 7vw, 88px);
      font-weight: 800;
      line-height: 1;
    }

    @media (max-width: 600px) {
      .counter {
        width: 82%;
        top: 43%;
      }

      .counter h2 {
        margin-bottom: 5px;
      }
    }
  </style>
</head>

<body>

  <main>

    <!-- STRÁNKA 1 -->
    <img
      class="canva"
      src="page-1.png"
      alt="Adéla běží 111 km za mámy samoživitelky"
    >

    <!-- STRÁNKA 2 + POČÍTADLO -->
    <div class="page-two">

      <img
        class="canva"
        src="page-2.png"
        alt="O projektu"
      >

      <section class="counter" aria-label="Vybraná částka">

        <h2>Společně jsme zatím vybrali</h2>

        <div class="amount">
          <span id="amount">—</span> Kč
        </div>

      </section>

    </div>

    <!-- STRÁNKA 3 -->
    <img
      class="canva"
      src="page-3.png"
      alt="Proč pomáhat maminkám samoživitelkám"
    >

    <!-- STRÁNKA 4 -->
    <img
      class="canva"
      src="page-4.png"
      alt="Nadační fond MÁMY V KAŠI"
    >

  </main>

  <script>
    async function updateAmount() {
      try {

        const response = await fetch(
          "./amount.json?v=" + Date.now(),
          {
            cache: "no-store"
          }
        );

        if (!response.ok) {
          throw new Error("Nepodařilo se načíst amount.json");
        }

        const data = await response.json();

        const value = Number(data.raised || 0);

        document.getElementById("amount").textContent =
          value.toLocaleString("cs-CZ");

      } catch (error) {

        console.error(error);

        document.getElementById("amount").textContent = "—";
      }
    }

    updateAmount();

    setInterval(updateAmount, 60000);
  </script>

</body>
</html>
