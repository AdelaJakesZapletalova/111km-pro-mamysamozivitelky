<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: white;
      font-family: Arial, Helvetica, sans-serif;
      color: #000;
    }

    .fundraiser {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 30px 25px;
      text-align: center;
    }

    .label {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1.5px;
      margin-bottom: 12px;
    }

    .amount {
      font-size: 52px;
      line-height: 1;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .goal {
      font-size: 17px;
      margin-bottom: 22px;
    }

    .progress-wrapper {
      width: 100%;
      height: 18px;
      background: #e9e9e9;
      border-radius: 20px;
      overflow: hidden;
    }

    .progress {
      height: 100%;
      width: 0%;
      background: #829985;
      border-radius: 20px;
      transition: width 0.6s ease;
    }

    .percent {
      margin-top: 10px;
      font-size: 16px;
      font-weight: 700;
      color: #829985;
    }

    @media (max-width: 600px) {
      .fundraiser {
        padding: 25px 18px;
      }

      .amount {
        font-size: 42px;
      }

      .goal {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

  <div class="fundraiser">

    <div class="label">
      VYBRÁNO PRO MÁMY V KÁŠI
    </div>

    <div class="amount" id="amount">
      0 Kč
    </div>

    <div class="goal" id="goal">
      z cílových 500 000 Kč
    </div>

    <div class="progress-wrapper">
      <div class="progress" id="progress"></div>
    </div>

    <div class="percent" id="percent">
      0 %
    </div>

  </div>

  <script>
    async function updateFundraiser() {
      try {
        const response = await fetch(
          "amount.json?ts=" + Date.now()
        );

        if (!response.ok) {
          throw new Error("Nepodařilo se načíst amount.json");
        }

        const data = await response.json();

        const raised = Number(data.raised) || 0;
        const goal = Number(data.goal) || 500000;

        const percentage = Math.min(
          (raised / goal) * 100,
          100
        );

        document.getElementById("amount").textContent =
          raised.toLocaleString("cs-CZ") + " Kč";

        document.getElementById("goal").textContent =
          "z cílových " +
          goal.toLocaleString("cs-CZ") +
          " Kč";

        document.getElementById("progress").style.width =
          percentage + "%";

        document.getElementById("percent").textContent =
          percentage.toLocaleString(
            "cs-CZ",
            {
              minimumFractionDigits: 0,
              maximumFractionDigits: 2
            }
          ) + " %";

      } catch (error) {
        console.error(
          "Chyba při načítání částky:",
          error
        );
      }
    }

    updateFundraiser();

    setInterval(
      updateFundraiser,
      60000
    );
  </script>

</body>
</html>
