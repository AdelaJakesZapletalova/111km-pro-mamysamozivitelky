<!doctype html>
<html lang="cs">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Adéla běží 111 km za mámy samoživitelky</title>

  <meta
    name="description"
    content="Adéla běží 111 km Brdami na podporu maminek samoživitelek a jejich dětí."
  >

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #fff;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      width: 100%;
      overflow: hidden;
    }

    .page {
      position: relative;
      width: 100%;
      margin: 0;
      padding: 0;
    }

    .canva {
      display: block;
      width: 100%;
      height: auto;
      margin: 0;
      padding: 0;
    }


    /* DRUHÁ STRÁNKA */

    .page-two {
      position: relative;
      width: 100%;
    }


    /* POČÍTADLO */

    .counter {
      position: absolute;

      /* 1 CM DOPRAVA + 2 CM DOLŮ */
      top: calc(15% + 2cm);
      left: calc(50% + 1cm);

      width: 31%;

      /* CELÉ POČÍTADLO O 15 % VĚTŠÍ */
      transform: translate(-50%, -50%) scale(1.15);
      transform-origin: center center;

      text-align: center;
      z-index: 10;

      color: #C68BFF !important;
    }


    /* NADPIS */

    .counter h2 {
      margin: 0 0 12px 0;
      padding: 0;

      color: #C68BFF !important;

      font-size: clamp(18px, 2.2vw, 32px);
      font-weight: 700;
      line-height: 1.1;

      white-space: nowrap;
    }


    /* ČÁSTKA */

    .counter .amount {
      margin: 0;
      padding: 0;

      color: #C68BFF !important;

      font-size: clamp(45px, 6vw, 82px);
      font-weight: 800;
      line-height: 1;
    }


    /* PROCENTA */

    .counter .percentage {
      margin: 14px 0 0 0;
      padding: 0;

      color: #C68BFF !important;

      font-size: clamp(13px, 1.3vw, 19px);
      font-weight: 700;
      line-height: 1.2;

      text-align: center;
      white-space: nowrap;
    }


    /* PROGRESS BAR */

    .counter .progress {
      position: relative;
      display: block;

      width: 100%;
      height: 20px;

      margin: 14px auto 0;

      border: 2px solid #C68BFF !important;
      background: transparent;

      overflow: hidden;
    }


    .counter .progress-fill {
      display: block;

      height: 100%;
      width: 0%;

      background-color: #C68BFF !important;

      transition: width 0.6s ease;
    }


    /* MOBIL */

    @media (max-width: 700px) {

      .counter {
        top: 15%;
        left: 50%;
        width: 31%;

        transform: translate(-50%, -50%) scale(1.15);
        transform-origin: center center;
      }

      .counter h2 {
        margin-bottom: 6px;
        font-size: clamp(10px, 2.1vw, 18px);
      }

      .counter .amount {
        font-size: clamp(27px, 6vw, 50px);
      }

      .counter .percentage {
        margin-top: 7px;
        font-size: clamp(7px, 1.7vw, 13px);
      }

      .counter .progress {
        height: 12px;
        margin-top: 7px;
        border-width: 2px !important;
      }

    }


    @media (min-width: 1500px) {

      main {
        max-width: 1800px;
        margin: auto;
      }

    }

  </style>
</head>


<body>

  <main>


    <!-- STRÁNKA 1 -->

    <div class="page">

      <img
        class="canva"
        src="page-1.png"
        alt="Adéla běží 111 km za mámy samoživitelky"
      >

    </div>



    <!-- STRÁNKA 2 + POČÍTADLO -->

    <div class="page page-two">

      <img
        class="canva"
        src="page-2.png"
        alt="O projektu"
      >


      <section
        class="counter"
        aria-label="Stav sbírky"
      >

        <h2>
          Společně jsme zatím vybrali
        </h2>


        <div
          class="amount"
          id="amount"
        >
          0 Kč
        </div>


        <div
          class="percentage"
          id="percentage"
        >
          0 % z cílových 500 000 Kč
        </div>


        <div
          class="progress"
          aria-label="Průběh sbírky"
        >

          <div
            class="progress-fill"
            id="progress-fill"
          ></div>

        </div>

      </section>

    </div>



    <!-- STRÁNKA 3 -->

    <div class="page">

      <img
        class="canva"
        src="page-3.png"
        alt="Proč pomáhat maminkám samoživitelkám"
      >

    </div>



    <!-- STRÁNKA 4 -->

    <div class="page">

      <img
        class="canva"
        src="page-4.png"
        alt="Nadační fond Mámy v kaši"
      >

    </div>


  </main>



  <script>

    async function updateAmount() {

      try {

        const response = await fetch(
          "./amount.json?time=" + Date.now(),
          {
            cache: "no-store"
          }
        );


        if (!response.ok) {
          throw new Error("Nepodařilo se načíst amount.json");
        }


        const data = await response.json();

        const raised =
          Number(data.raised) || 0;

        const goal =
          Number(data.goal) || 500000;


        /* ČÁSTKA */

        document
          .getElementById("amount")
          .textContent =
            raised.toLocaleString(
              "cs-CZ",
              {
                maximumFractionDigits: 0
              }
            ) + " Kč";


        /* PROCENTA */

        const percentage =
          goal > 0
            ? (raised / goal) * 100
            : 0;


        let percentageText;


        if (
          percentage > 0 &&
          percentage < 0.01
        ) {

          percentageText = "< 0,01";

        } else {

          percentageText =
            percentage.toLocaleString(
              "cs-CZ",
              {
                minimumFractionDigits:
                  percentage < 1 ? 2 : 0,

                maximumFractionDigits: 2
              }
            );

        }


        document
          .getElementById("percentage")
          .textContent =
            percentageText
            + " % z cílových "
            + goal.toLocaleString("cs-CZ")
            + " Kč";


        /* PROGRESS BAR */

        const realBarPercentage =
          Math.min(
            Math.max(percentage, 0),
            100
          );


        const visibleBarPercentage =
          realBarPercentage > 0
            ? Math.max(realBarPercentage, 1.5)
            : 0;


        document
          .getElementById("progress-fill")
          .style.width =
            visibleBarPercentage + "%";


      } catch (error) {

        console.error(
          "Chyba při načítání částky:",
          error
        );


        document
          .getElementById("amount")
          .textContent = "— Kč";


        document
          .getElementById("percentage")
          .textContent = "Cíl 500 000 Kč";

      }

    }


    updateAmount();


    setInterval(
      updateAmount,
      60000
    );

  </script>

</body>

</html>
