<!doctype html>
<html lang="cs">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Adéla běží 111 km za mámy samoživitelky</title>

  <meta
    name="description"
    content="Adéla běží 111 km Brdami na podporu maminek samoživitelek a jejich dětí."
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #fff;
      color: #111;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      width: 100%;
      overflow: hidden;
    }

    .page {
      position: relative;
      width: 100%;
      margin: 0;
      padding: 0;
    }

    .canva {
      display: block;
      width: 100%;
      height: auto;
      margin: 0;
      padding: 0;
    }

    /* Druhá stránka – počítadlo je vložené do volného místa */
    .page-two {
      position: relative;
      width: 100%;
    }

    .counter {
      position: absolute;

      /* výška počítadla na stránce */
      top: 6%;

      left: 50%;
      transform: translateX(-50%);

      width: 70%;
      text-align: center;
      z-index: 10;
      color: #111;
    }

    .counter h2 {
      margin: 0 0 8px;
      font-size: clamp(18px, 2.5vw, 34px);
      font-weight: 700;
    }

    .amount {
      margin: 0;
      font-size: clamp(42px, 7vw, 88px);
      font-weight: 800;
      line-height: 1;
    }

    .percentage {
      margin: 12px 0 0;
      font-size: clamp(14px, 1.5vw, 21px);
      font-weight: 700;
      text-align: center;
      white-space: nowrap;
    }

    /* Užší obdélník uprostřed */
    .progress {
      position: relative;
      display: block;
      width: 55%;
      height: 24px;
      margin: 12px auto 0;
      border: 3px solid #111;
      background: #fff;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: #111;
      transition: width 0.6s ease;
    }

    @media (max-width: 700px) {
      .counter {
        width: 75%;
      }

      .counter h2 {
        font-size: clamp(15px, 3vw, 24px);
      }

      .amount {
        font-size: clamp(36px, 8vw, 65px);
      }

      .percentage {
        font-size: clamp(11px, 2.2vw, 16px);
      }

      .progress {
        width: 60%;
        height: 18px;
        border-width: 2px;
      }
    }

    @media (min-width: 1500px) {
      main {
        max-width: 1800px;
        margin: auto;
      }
    }
  </style>
</head>

<body>

  <main>

    <!-- STRÁNKA 1 -->
    <div class="page">
      <img
        class="canva"
        src="page-1.png"
        alt="Adéla běží 111 km za mámy samoživitelky"
      >
    </div>

    <!-- STRÁNKA 2 -->
    <div class="page page-two">

      <img
        class="canva"
        src="page-2.png"
        alt="O projektu"
      >

      <div class="counter">

        <h2>Společně jsme zatím vybrali</h2>

        <div
          class="amount"
          id="amount"
        >
          0 Kč
        </div>

        <div
          class="percentage"
          id="percentage"
        >
          0 % z cílových 500 000 Kč
        </div>

        <div class="progress">
          <div
            class="progress-fill"
            id="progress-fill"
          ></div>
        </div>

      </div>

    </div>

    <!-- STRÁNKA 3 -->
    <div class="page">
      <img
        class="canva"
        src="page-3.png"
        alt="Proč pomáhat"
      >
    </div>

    <!-- STRÁNKA 4 -->
    <div class="page">
      <img
        class="canva"
        src="page-4.png"
        alt="Nadační fond Mámy v kaši"
      >
    </div>

  </main>

  <script>
    async function updateAmount() {
      try {
        const response = await fetch(
          "amount.json?time=" + Date.now(),
          {
            cache: "no-store"
          }
        );

        if (!response.ok) {
          throw new Error("Nepodařilo se načíst amount.json");
        }

        const data = await response.json();

        const raised = Number(data.raised) || 0;
        const goal = Number(data.goal) || 500000;

        const percentage =
          goal > 0
            ? (raised / goal) * 100
            : 0;

        document.getElementById("amount").textContent =
          raised.toLocaleString("cs-CZ", {
            maximumFractionDigits: 0
          }) + " Kč";

        let percentageText;

        if (percentage > 0 && percentage < 0.01) {
          percentageText = "< 0,01";
        } else {
          percentageText =
            percentage.toLocaleString("cs-CZ", {
              minimumFractionDigits: percentage < 1 ? 2 : 0,
              maximumFractionDigits: 2
            });
        }

        document.getElementById("percentage").textContent =
          percentageText +
          " % z cílových " +
          goal.toLocaleString("cs-CZ") +
          " Kč";

        /*
          Graf se při částce nad cílem zastaví vizuálně na 100 %,
          ale skutečná částka nahoře se dál normálně zobrazuje.
        */
        const barPercentage =
          Math.min(percentage, 100);

        document.getElementById("progress-fill").style.width =
          barPercentage + "%";

      } catch (error) {
        console.error(
          "Chyba při načítání částky:",
          error
        );
      }
    }

    updateAmount();

    /* kontrola nové částky každou minutu */
    setInterval(updateAmount, 60000);
  </script>

</body>

</html>
