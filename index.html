<!doctype html>
<html lang="cs">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Adéla běží 111 km za mámy samoživitelky</title>

  <meta
    name="description"
    content="Adéla běží 111 km Brdami na podporu maminek samoživitelek a jejich dětí."
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #fff;
      color: #111;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      width: 100%;
      overflow: hidden;
    }

    .canva {
      display: block;
      width: 100%;
      height: auto;
      margin: 0;
      padding: 0;
    }

    /* DRUHÁ STRÁNKA */
    .page-two {
      position: relative;
      width: 100%;
    }

    /* POČÍTADLO */
    .counter {
      position: absolute;

      /* Tuhle pozici necháváme */
      top: 6%;
      left: 50%;
      transform: translate(-50%, -50%);

      width: 58%;
      text-align: center;
      z-index: 10;
      color: #111;
    }

    .counter h2 {
      margin: 0 0 7px;
      font-size: clamp(18px, 2.5vw, 34px);
      font-weight: 700;
    }

    .amount {
      margin: 0;
      font-size: clamp(42px, 7vw, 88px);
      font-weight: 800;
      line-height: 1;
    }

    /* PROCENTA */
    .percentage {
      margin-top: 10px;
      font-size: clamp(15px, 1.7vw, 24px);
      font-weight: 700;
    }

    /* PROGRESS BAR */
    .progress {
      position: relative;
      width: 100%;
      height: clamp(18px, 2.2vw, 32px);

      margin: 10px auto 0;

      border: 3px solid #111;
      background: #fff;

      overflow: hidden;
    }

    .progress-fill {
      width: 0%;
      height: 100%;

      background:
        repeating-linear-gradient(
          -45deg,
          #111 0,
          #111 10px,
          #444 10px,
          #444 20px
        );

      transition: width 0.8s ease;
    }

    /* CÍLOVÁ ČÁSTKA */
    .goal-text {
      margin-top: 7px;
      text-align: right;

      font-size: clamp(12px, 1.2vw, 17px);
      font-weight: 600;
    }

    @media (max-width: 700px) {
      .counter {
        width: 72%;
      }

      .counter h2 {
        font-size: 16px;
      }

      .amount {
        font-size: 42px;
      }

      .percentage {
        margin-top: 6px;
        font-size: 14px;
      }

      .progress {
        margin-top: 6px;
        border-width: 2px;
      }

      .goal-text {
        margin-top: 4px;
        font-size: 11px;
      }
    }

    @media (min-width: 1500px) {
      main {
        max-width: 1800px;
        margin: auto;
      }
    }
  </style>
</head>


<body>

  <main>

    <!-- STRÁNKA 1 -->
    <img
      class="canva"
      src="page-1.png"
      alt="Adéla běží 111 km za mámy samoživitelky"
    >


    <!-- STRÁNKA 2 -->
    <div class="page-two">

      <img
        class="canva"
        src="page-2.png"
        alt="O projektu"
      >

      <section
        class="counter"
        aria-label="Stav sbírky"
      >

        <h2>
          Společně jsme zatím vybrali
        </h2>

        <div
          class="amount"
          id="amount"
        >
          0 Kč
        </div>

        <div
          class="percentage"
          id="percentage"
        >
          0 %
        </div>

        <div
          class="progress"
          aria-label="Průběh sbírky"
        >
          <div
            class="progress-fill"
            id="progress-fill"
          ></div>
        </div>

        <div
          class="goal-text"
          id="goal-text"
        >
          z cílových 500 000 Kč
        </div>

      </section>

    </div>


    <!-- STRÁNKA 3 -->
    <img
      class="canva"
      src="page-3.png"
      alt="Proč pomáhat maminkám samoživitelkám"
    >


    <!-- STRÁNKA 4 -->
    <img
      class="canva"
      src="page-4.png"
      alt="Nadační fond Mámy v kaši"
    >

  </main>


  <script>

    async function updateAmount() {

      try {

        const response = await fetch(
          "amount.json?t=" + Date.now(),
          {
            cache: "no-store"
          }
        );

        if (!response.ok) {
          throw new Error("Nepodařilo se načíst amount.json");
        }

        const data = await response.json();

        const raised =
          Number(data.raised) || 0;

        const goal =
          Number(data.goal) || 500000;


        /* ČÁSTKA */

        document.getElementById("amount").textContent =
          new Intl.NumberFormat(
            "cs-CZ",
            {
              maximumFractionDigits: 0
            }
          ).format(raised)
          + " Kč";


        /* PROCENTA */

        const percentage =
          goal > 0
            ? (raised / goal) * 100
            : 0;


        let percentageText;

        if (percentage < 1) {

          percentageText =
            percentage.toLocaleString(
              "cs-CZ",
              {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
              }
            );

        } else {

          percentageText =
            percentage.toLocaleString(
              "cs-CZ",
              {
                maximumFractionDigits: 1
              }
            );

        }


        document.getElementById(
          "percentage"
        ).textContent =
          percentageText + " %";


        /* PROGRESS BAR */

        const barPercentage =
          Math.min(
            Math.max(percentage, 0),
            100
          );


        document.getElementById(
          "progress-fill"
        ).style.width =
          barPercentage + "%";


        /* CÍL */

        document.getElementById(
          "goal-text"
        ).textContent =
          "z cílových " +
          new Intl.NumberFormat(
            "cs-CZ",
            {
              maximumFractionDigits: 0
            }
          ).format(goal)
          + " Kč";


      } catch (error) {

        console.error(error);

        document.getElementById(
          "amount"
        ).textContent = "— Kč";

        document.getElementById(
          "percentage"
        ).textContent = "";

        document.getElementById(
          "goal-text"
        ).textContent =
          "Cíl 500 000 Kč";

      }

    }


    /* načíst ihned */
    updateAmount();


    /* obnovovat každou minutu */
    setInterval(
      updateAmount,
      60000
    );

  </script>

</body>

</html>
