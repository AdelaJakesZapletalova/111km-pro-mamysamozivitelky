<!doctype html>
<html lang="cs">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Adéla běží 111 km za mámy samoživitelky</title>

  <meta
    name="description"
    content="Adéla běží 111 km Brdami na podporu maminek samoživitelek a jejich dětí."
  >

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #fff;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      width: 100%;
      overflow: hidden;
    }

    .page {
      position: relative;
      width: 100%;
      margin: 0;
      padding: 0;
    }

    .canva {
      display: block;
      width: 100%;
      height: auto;
      margin: 0;
      padding: 0;
    }


    /* ========================================
       POČÍTADLO NA DRUHÉ STRÁNCE
       ======================================== */

    .page-two {
      position: relative;
      width: 100%;
    }

    .counter {
      position: absolute;

      /* POZICE V PRÁZDNÉM PROSTORU */
      top: 15%;
      left: 46%;

      /* ŠÍŘKA BLOKU */
      width: 32%;

      /* 15 % VĚTŠÍ */
      transform: scale(1.15);
      transform-origin: center center;

      text-align: center;

      /* FIALOVÁ */
      color: #C68BFF;

      z-index: 10;
    }


    /* NADPIS */

    .counter h2 {
      margin: 0 0 10px;
      padding: 0;

      color: #C68BFF;

      font-size: clamp(18px, 2.2vw, 32px);
      font-weight: 700;
      line-height: 1.1;

      white-space: nowrap;
    }


    /* VYBRANÁ ČÁSTKA */

    .amount {
      margin: 0;
      padding: 0;

      color: #C68BFF;

      font-size: clamp(45px, 6vw, 82px);
      font-weight: 800;
      line-height: 1;
    }


    /* PROCENTA + CÍL */

    .percentage {
      margin: 14px 0 0;
      padding: 0;

      color: #C68BFF;

      font-size: clamp(13px, 1.3vw, 19px);
      font-weight: 700;
      line-height: 1.2;

      text-align: center;
      white-space: nowrap;
    }


    /* PROGRESS BAR */

    .progress {
      position: relative;

      display: block;

      width: 100%;
      height: 20px;

      margin: 14px auto 0;

      /* FIALOVÝ RÁMEČEK */
      border: 2px solid #C68BFF;

      background: #fff;

      overflow: hidden;
    }


    /* FIALOVÁ VÝPLŇ */

    .progress-fill {
      height: 100%;
      width: 0%;

      background: #C68BFF;

      transition: width 0.6s ease;
    }


    /* MOBIL */

    @media (max-width: 700px) {

      .counter {
        top: 15%;
        left: 46%;
        width: 32%;

        transform: scale(1.15);
        transform-origin: center center;
      }

      .counter h2 {
        font-size: clamp(11px, 2.1vw, 18px);
      }

      .amount {
        font-size: clamp(28px, 6vw, 50px);
      }

      .percentage {
        margin-top: 8px;
        font-size: clamp(8px, 1.7vw, 13px);
      }

      .progress {
        height: 12px;
        margin-top: 8px;
        border-width: 2px;
      }

    }


    @media (min-width: 1500px) {

      main {
        max-width: 1800px;
        margin: auto;
      }

    }

  </style>

</head>


<body>

  <main>


    <!-- ========================================
         STRÁNKA 1
         ======================================== -->

    <div class="page">

      <img
        class="canva"
        src="page-1.png"
        alt="Adéla běží 111 km za mámy samoživitelky"
      >

    </div>



    <!-- ========================================
         STRÁNKA 2 + POČÍTADLO
         ======================================== -->

    <div class="page page-two">

      <img
        class="canva"
        src="page-2.png"
        alt="O projektu"
      >


      <section
        class="counter"
        aria-label="Stav sbírky"
      >


        <h2>
          Společně jsme zatím vybrali
        </h2>


        <div
          class="amount"
          id="amount"
        >
          0 Kč
        </div>


        <div
          class="percentage"
          id="percentage"
        >
          0 % z cílových 500 000 Kč
        </div>


        <div
          class="progress"
          aria-label="Průběh sbírky"
        >

          <div
            class="progress-fill"
            id="progress-fill"
          ></div>

        </div>


      </section>

    </div>



    <!-- ========================================
         STRÁNKA 3
         ======================================== -->

    <div class="page">

      <img
        class="canva"
        src="page-3.png"
        alt="Proč pomáhat maminkám samoživitelkám"
      >

    </div>



    <!-- ========================================
         STRÁNKA 4
         ======================================== -->

    <div class="page">

      <img
        class="canva"
        src="page-4.png"
        alt="Nadační fond Mámy v kaši"
      >

    </div>


  </main>



  <script>

    async function updateAmount() {

      try {

        /* NAČTENÍ amount.json */

        const response = await fetch(
          "./amount.json?time=" + Date.now(),
          {
            cache: "no-store"
          }
        );


        if (!response.ok) {

          throw new Error(
            "Nepodařilo se načíst amount.json"
          );

        }


        const data =
          await response.json();


        /* HODNOTY */

        const raised =
          Number(data.raised) || 0;

        const goal =
          Number(data.goal) || 500000;


        /* ========================================
           VYBRANÁ ČÁSTKA
           ======================================== */

        document
          .getElementById("amount")
          .textContent =
            raised.toLocaleString(
              "cs-CZ",
              {
                maximumFractionDigits: 0
              }
            )
            + " Kč";


        /* ========================================
           PROCENTA
           ======================================== */

        const percentage =
          goal > 0
            ? (raised / goal) * 100
            : 0;


        let percentageText;


        if (
          percentage > 0 &&
          percentage < 0.01
        ) {

          percentageText =
            "< 0,01";

        }

        else {

          percentageText =
            percentage.toLocaleString(
              "cs-CZ",
              {
                minimumFractionDigits:
                  percentage < 1 ? 2 : 0,

                maximumFractionDigits: 2
              }
            );

        }


        document
          .getElementById("percentage")
          .textContent =
            percentageText
            + " % z cílových "
            + goal.toLocaleString("cs-CZ")
            + " Kč";


        /* ========================================
           PROGRESS BAR
           ======================================== */

        const realBarPercentage =
          Math.min(
            Math.max(percentage, 0),
            100
          );


        /*
          Při velmi malé částce necháme
          alespoň malý fialový začátek,
          aby bylo vidět, že se bar plní.
        */

        const visibleBarPercentage =
          realBarPercentage > 0
            ? Math.max(realBarPercentage, 1.5)
            : 0;


        document
          .getElementById("progress-fill")
          .style.width =
            visibleBarPercentage + "%";


      }

      catch (error) {

        console.error(
          "Chyba při načítání částky:",
          error
        );


        document
          .getElementById("amount")
          .textContent =
            "— Kč";


        document
          .getElementById("percentage")
          .textContent =
            "Cíl 500 000 Kč";

      }

    }



    /* NAČÍST HNED */

    updateAmount();



    /* OBNOVA KAŽDOU MINUTU */

    setInterval(
      updateAmount,
      60000
    );

  </script>


</body>

</html>
